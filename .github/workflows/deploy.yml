name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # npm ci 在 runner 上挂死：npm 11 fetch 挂起 bug 家族（npm/cli#6380 #7891 #9386）。
      # 三层保险：1) IPv4 优先 DNS；2) 升级 npm 12（与本地一致，allowScripts 为其特性）；
      # 3) 显式 fetch 短超时+重试 + timeout 300 快速失败。
      - name: Install dependencies
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          npm install -g npm@12.0.2 --no-audit --no-fund --fetch-retries=5 --fetch-timeout=60000
          timeout 300 npm ci --no-audit --no-fund --fetch-retries=5 --fetch-timeout=60000 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=30000
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
